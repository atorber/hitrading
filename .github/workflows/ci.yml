name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: 校验（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # 无运行时依赖（peer 由 Harness profile 提供），无 lockfile，不启用 npm 缓存

      - name: 语法检查（node --check 全部 JS）
        run: |
          fail=0
          for f in index.js client.js server.js lib/*.js; do
            if node --check "$f"; then echo "  ok  $f"; else echo "::error file=$f::node --check failed"; fail=1; fi
          done
          exit $fail

      - name: 清单与补丁校验
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const must = ['name','version','description','license','exports','files'];
          for (const k of must) if (!pkg[k]) { console.error('package.json missing', k); process.exit(1); }
          if (!pkg.exports['.'] || !pkg.exports['./client'] || !pkg.exports['./icon']) { console.error('exports incomplete'); process.exit(1); }
          if (!pkg.dsh?.bundle?.patch) { console.error('dsh.bundle.patch missing'); process.exit(1); }
          const patch = fs.readFileSync('cordis.patch.yml', 'utf8');
          if (!patch.includes(pkg.name)) { console.error('patch does not reference package name'); process.exit(1); }
          const zh = JSON.parse(fs.readFileSync('locale/zh.json', 'utf8'));
          const en = JSON.parse(fs.readFileSync('locale/en.json', 'utf8'));
          for (const [name, l] of [['zh', zh], ['en', en]]) {
            if (!l.meta?.title || !l.meta?.description) { console.error('locale/' + name + '.json meta incomplete'); process.exit(1); }
          }
          console.log('manifest ok:', pkg.name, pkg.version);
          "

      - name: 打包校验（npm pack，校验文件清单）
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          node --input-type=module -e "
          import fs from 'node:fs';
          const listed = fs.readFileSync('pack.log', 'utf8');
          const required = ['index.js','client.js','server.js','cordis.patch.yml','locale/zh.json','locale/en.json','icon.svg','LICENSE','README.md','skills/hitrading/SKILL.md'];
          const missing = required.filter((f) => !listed.split('\n').some((l) => l.trim().endsWith(' ' + f) || l.trim().endsWith(f)));
          if (missing.length) { console.error('missing from package:', missing); process.exit(1); }
          console.log('package file list ok');
          "

      - name: 打包件冒烟（解包后 --check + 启动 server.js 健康探测）
        run: |
          npm pack
          mkdir -p smoke && tar -xzf *.tgz -C smoke
          fail=0
          for f in smoke/package/index.js smoke/package/client.js smoke/package/server.js smoke/package/lib/*.js; do
            node --check "$f" || fail=1
          done
          [ $fail -eq 0 ] && echo 'packed sources: syntax ok'
          HITRADING_PORT=18099 HITRADING_DB=/tmp/hitrading-ci.db node smoke/package/server.js &
          SVPID=$!
          sleep 2
          curl -fsS -m 5 http://127.0.0.1:18099/health || { kill $SVPID; echo '::error::server health check failed'; exit 1; }
          curl -fsS -m 10 http://127.0.0.1:18099/api?op=energy | head -c 80 || { kill $SVPID; echo '::error::energy op failed'; exit 1; }
          echo ''
          kill $SVPID
          rm -f /tmp/hitrading-ci.db*
