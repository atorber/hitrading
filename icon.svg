<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A股红涨绿跌趋势图标：三根K线 + 上升趋势线 -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#1a1a2e"/>
  <!-- 上升趋势线 -->
  <polyline points="14,44 30,34 44,22 54,14" fill="none" stroke="#e63946" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 三根K线（实体+影线），主体红色表上涨 -->
  <g stroke="#e63946" stroke-width="2">
    <line x1="22" y1="26" x2="22" y2="46"/>
    <line x1="32" y1="18" x2="32" y2="40"/>
    <line x1="42" y1="12" x2="42" y2="30"/>
  </g>
  <g fill="#e63946">
    <rect x="18" y="30" width="8" height="10" rx="1"/>
    <rect x="28" y="22" width="8" height="12" rx="1"/>
    <rect x="38" y="15" width="8" height="10" rx="1"/>
  </g>
  <!-- 一根绿色阴线 -->
  <g stroke="#2a9d8f" stroke-width="2"><line x1="50" y1="10" x2="50" y2="26"/></g>
  <g fill="#2a9d8f"><rect x="47" y="12" width="6" height="7" rx="1"/></g>
</svg>